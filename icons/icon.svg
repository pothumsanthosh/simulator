<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="switchaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#03b585" />
    </linearGradient>
    <linearGradient id="switchaNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="switchaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#switchaBg)" stroke="#334155" stroke-width="4"/>
  
  <!-- Tech Circuit Grid -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="2">
    <line x1="16" y1="128" x2="496" y2="128" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="384" x2="496" y2="384" />
    <line x1="128" y1="16" x2="128" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="384" y1="16" x2="384" y2="496" />
  </g>

  <!-- High-Tech Switch Toggle Symbol (ON State) -->
  <!-- Wire Left -->
  <line x1="72" y1="256" x2="168" y2="256" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" filter="url(#switchaGlow)"/>
  <!-- Switch Terminal 1 -->
  <circle cx="168" cy="256" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="12" filter="url(#switchaGlow)"/>
  
  <!-- Switch Arm Blade (Connected in active ON state with Lightning Spark) -->
  <line x1="172" y1="256" x2="340" y2="256" stroke="#10b981" stroke-width="20" stroke-linecap="round" filter="url(#switchaGlow)"/>
  
  <!-- Switch Terminal 2 -->
  <circle cx="344" cy="256" r="22" fill="#0f172a" stroke="#10b981" stroke-width="12" filter="url(#switchaGlow)"/>
  <!-- Wire Right -->
  <line x1="344" y1="256" x2="440" y2="256" stroke="#10b981" stroke-width="18" stroke-linecap="round" filter="url(#switchaGlow)"/>

  <!-- Glowing Energy Lightning Pulse at Center -->
  <polygon points="270,100 216,236 264,236 232,380 308,220 260,220" fill="#facc15" stroke="#ffffff" stroke-width="5" filter="url(#switchaGlow)"/>
</svg>
