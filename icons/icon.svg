<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- e-Samastha — Integrated ECE Engineering Simulation & Learning Platform -->
  <defs>
    <linearGradient id="esamasthaIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2922" />
    </linearGradient>
    <linearGradient id="esamasthaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#03b585" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="esamasthaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#esamasthaIconBg)" stroke="#334155" stroke-width="4"/>
  
  <!-- Engineering Circuit Grid Traces -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="2">
    <line x1="16" y1="128" x2="496" y2="128" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="384" x2="496" y2="384" />
    <line x1="128" y1="16" x2="128" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="384" y1="16" x2="384" y2="496" />
  </g>

  <!-- Circuit Trace Node Motif: Stylized Lowercase 'e' -->
  <!-- Input Trace from Left -->
  <line x1="64" y1="256" x2="160" y2="256" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  <circle cx="160" cy="256" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Main Lowercase 'e' Body: Circuit Loop Path -->
  <!-- Horizontal bar passing through center -->
  <line x1="160" y1="256" x2="340" y2="256" stroke="#03b585" stroke-width="20" stroke-linecap="round"/>
  <!-- Top arc -->
  <path d="M 340 256 C 340 160, 160 160, 160 256 C 160 360, 310 370, 360 310" 
        fill="none" stroke="url(#esamasthaAccent)" stroke-width="20" stroke-linecap="round" filter="url(#esamasthaGlow)"/>
  
  <!-- Circuit Nodes & Terminals -->
  <circle cx="360" cy="310" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#esamasthaGlow)"/>
  <circle cx="256" cy="180" r="10" fill="#facc15" stroke="#ffffff" stroke-width="3"/>
  <line x1="256" y1="180" x2="256" y2="256" stroke="#38bdf8" stroke-width="8" stroke-dasharray="6 6"/>

  <!-- Clean Geometric Brand Typography -->
  <text x="256" y="445" font-family="'Lato', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5px">
    e-<tspan fill="#03b585">Samastha</tspan>
  </text>
</svg>
