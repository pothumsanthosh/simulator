<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03b585;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#grad1)" />
  
  <!-- Circuit Grid Lines Pattern Background -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="3">
    <line x1="16" y1="128" x2="496" y2="128" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="384" x2="496" y2="384" />
    <line x1="128" y1="16" x2="128" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="384" y1="16" x2="384" y2="496" />
  </g>

  <!-- Central Electronics Core Emblem -->
  <!-- Outer Circuit Ring & Nodes -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Circuit Traces -->
  <path d="M96 256 H176 L216 180 L256 332 L296 200 L336 256 H416" fill="none" stroke="url(#grad2)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- High-Tech Junction Nodes -->
  <circle cx="96" cy="256" r="14" fill="#ffffff" stroke="#03b585" stroke-width="6"/>
  <circle cx="256" cy="332" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="6"/>
  <circle cx="416" cy="256" r="14" fill="#ffffff" stroke="#03b585" stroke-width="6"/>
  
  <!-- Central Lightning Spark Energy -->
  <polygon points="270,120 220,240 264,240 236,380 300,230 256,230" fill="#facc15" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
</svg>
